<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>PackPass</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23F7C56A'/%3E%3Cstop offset='1' stop-color='%23C4801F'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Cpath d='M28 52l14 14 30-30' fill='none' stroke='white' stroke-width='11' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0B0E14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PackPass">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js" defer></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --bg:#0B0E14; --card:#141922; --card-2:#1B222E; --line:#262E3B;
    --gold:#E7A63C; --gold-dim:#7A5220; --gold-ink:#241705;
    --teal:#33B8A6; --teal-ink:#052420;
    --text:#EEF1F6; --text-dim:#7C8698; --red:#E1655C;
    --shadow:0 16px 36px -16px rgba(0,0,0,0.55);
    --blob-op:0.14;
    --gold-tint:rgba(231,166,60,0.10);
    --progress-track:rgba(231,166,60,0.18);
  }
  :root[data-theme="light"]{
    --bg:#F3F4F8; --card:#FFFFFF; --card-2:#F7F8FB; --line:#E3E6EE;
    --gold:#936219; --gold-dim:#E7C596; --gold-ink:#FFFFFF;
    --teal:#158775; --teal-ink:#FFFFFF;
    --text:#171922; --text-dim:#6C7686; --red:#C6453E;
    --shadow:0 12px 26px -14px rgba(30,40,60,0.18);
    --blob-op:0.09;
    --gold-tint:rgba(184,122,31,0.08);
    --progress-track:rgba(184,122,31,0.14);
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
  body{position:relative;overflow-x:hidden;transition:background 0.25s;}
  body::before{
    content:'';position:fixed;top:-140px;left:50%;transform:translateX(-50%);
    width:520px;height:340px;border-radius:50%;
    background:radial-gradient(circle, var(--gold) 0%, transparent 70%);
    opacity:var(--blob-op);filter:blur(50px);pointer-events:none;z-index:0;
  }
  #root{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:88px;position:relative;z-index:1;}
  .display{font-family:'Fraunces',serif;font-optical-sizing:auto;letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;letter-spacing:0.04em;}
  svg{display:block;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px;}
  .brand{display:flex;align-items:center;gap:8px;color:var(--text-dim);}
  .brand .glyph{color:var(--gold);display:flex;}
  .brand .label{font-size:13px;font-family:'Fraunces',serif;font-weight:600;letter-spacing:-0.01em;color:var(--text);}
  .brand .glyph svg, .loading-logo svg, .welcome-logo svg{stroke-width:3;}
  .icon-btn{width:36px;height:36px;border-radius:11px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow);color:var(--text);transition:transform 0.12s;}
  .icon-btn:active{transform:scale(0.92);}
  .avatar-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;font-size:14px;font-family:'Fraunces',serif;box-shadow:var(--shadow);transition:transform 0.12s;flex:0 0 auto;}
  .avatar-btn:active{transform:scale(0.92);}
  .avatar-btn.filled{background:var(--gold);color:var(--gold-ink);}
  .avatar-btn.empty{background:var(--card);border:1px solid var(--line);color:var(--text-dim);}

  .pass{margin:0 20px 16px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);position:relative;}
  .pass-top{padding:18px 18px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;cursor:pointer;}
  .pass-top .eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:0.14em;color:var(--text-dim);font-weight:600;margin-bottom:6px;}
  .pass-top .tripname{font-size:23px;font-weight:600;line-height:1.15;margin-bottom:8px;}
  .pass-top .meta{font-size:10.5px;color:var(--text-dim);display:flex;align-items:center;gap:5px;}
  .pass-top .meta .chev{color:var(--gold);}
  .pass-edit{width:34px;height:34px;border-radius:10px;background:var(--card-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;color:var(--text);transition:transform 0.12s;}
  .pass-edit:active{transform:scale(0.92);}

  .perf{position:relative;height:0;border-top:1.5px dashed var(--line);}
  .perf::before,.perf::after{content:'';position:absolute;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1px solid var(--line);z-index:5;}
  .perf::before{left:-9px;}
  .perf::after{right:-9px;}

  .bottom-tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    display:flex;
    background:var(--card);
    border-top:1px solid var(--line);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -4px 16px -4px rgba(0,0,0,0.25);
  }
  .bottom-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 2px;cursor:pointer;color:var(--text-dim);border-radius:12px;transition:color 0.15s;}
  .bottom-tab .bt-ic{display:flex;}
  .bottom-tab .bt-label{font-size:10.5px;font-weight:600;}
  .bottom-tab.active{color:var(--gold);}

  .pass-progress-wrap{}
  .progress{position:relative;height:44px;border-radius:12px;background:var(--progress-track);border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow);}
  .progress.embedded, .progress-empty.embedded{
    box-shadow:none;
    border-radius:0 0 19px 19px;
    border:none;
    height:52px;
  }
  .progress.embedded{border-top:1px solid var(--line);}
  .progress-empty.embedded{border-top:1.5px dashed var(--line);}
  .progress.embedded .progress-label{padding:0 18px;}
  .progress-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg, var(--gold-dim), var(--gold));transition:width 0.45s cubic-bezier(.2,.8,.2,1);overflow:hidden;}
  .progress-fill::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(100deg, transparent 20%, rgba(255,255,255,0.35) 40%, transparent 60%);
    background-size:200% 100%;
    animation:progressShine 2.6s ease-in-out infinite;
  }
  @keyframes progressShine{0%{background-position:140% 0;}100%{background-position:-40% 0;}}
  .progress-label{position:relative;z-index:2;height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 16px;}
  .progress-label .status{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .progress-label .count{font-size:11px;color:var(--text-dim);font-weight:600;}
  .progress.complete{animation:progressGlow 1.1s ease-out;}
  .progress.complete .status{color:var(--gold-ink);}
  .progress.complete .count{color:var(--gold-ink);opacity:0.75;}
  .progress.complete .progress-fill::after{animation:none;opacity:0;}
  @keyframes progressGlow{
    0%{box-shadow:0 0 0 0 rgba(231,166,60,0.55);}
    60%{box-shadow:0 0 0 10px rgba(231,166,60,0);}
    100%{box-shadow:0 0 0 0 rgba(231,166,60,0);}
  }
  .progress-empty{height:44px;border-radius:12px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;gap:8px;color:var(--text-dim);font-size:12px;}

  .body-area{padding:0 20px 20px;display:flex;flex-direction:column;gap:12px;}

  /* Compact bulk icon buttons (replace old text links) */
  .bulk-icons{display:flex;gap:5px;flex:0 0 auto;}
  .bulk-icon-btn{width:29px;height:29px;border-radius:9px;background:var(--card-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-dim);transition:all 0.12s;}
  .bulk-icon-btn:active{transform:scale(0.9);}
  .bulk-icon-btn.check:hover{color:var(--teal);border-color:var(--teal);}
  .bulk-icon-btn.clear:hover{color:var(--red);border-color:var(--red);}

  .zone,.section{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);}
  .zone-head,.section-head{display:flex;align-items:center;gap:10px;padding:12px 14px;}
  .zone-head{cursor:pointer;}
  .zicon{width:34px;height:34px;border-radius:10px;background:var(--card-2);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--gold);}
  .ztitle{flex:1;font-size:13.5px;font-weight:700;}
  .zprog{font-size:10.5px;color:var(--text-dim);font-weight:600;white-space:nowrap;}
  .zone.zdone .zprog,.section.zdone .zprog{color:var(--teal);}
  .zcaret{color:var(--text-dim);transition:transform 0.2s;display:flex;}
  .zone.open .zcaret{transform:rotate(180deg);}

  .zone-items{max-height:0;overflow:hidden;transition:max-height 0.32s ease;padding:0 14px;}
  .zone.open .zone-items{max-height:900px;padding-bottom:12px;}
  .zone-items-inner{padding-left:44px;display:flex;flex-direction:column;}

  .section-body{padding:0 14px 12px 58px;}

  .drag-handle{color:var(--text-dim);cursor:grab;flex:0 0 auto;display:flex;padding:4px;margin:-4px;touch-action:none;}
  .drag-handle:active{cursor:grabbing;}
  .item-drag-handle{color:var(--text-dim);cursor:grab;flex:0 0 auto;display:flex;padding:5px 2px;margin:-5px -2px;opacity:0.45;touch-action:none;}
  .item-drag-handle:active{cursor:grabbing;}
  .sortable-ghost{opacity:0.35;}
  .sortable-chosen .item-drag-handle,.sortable-chosen .drag-handle{opacity:1;}

  .item{display:flex;align-items:center;gap:13px;padding:9px 0;border-top:1px solid var(--line);}
  .item:first-child{border-top:none;}
  .item.flag{background:var(--gold-tint);margin:0 -10px;padding:9px 10px;border-radius:9px;}
  .item.flag:first-child{border-top:none;}
  .checkbox{width:23px;height:23px;border-radius:50%;border:1.6px solid var(--text-dim);flex:0 0 auto;display:flex;align-items:center;justify-content:center;cursor:pointer;color:transparent;transition:all 0.15s;}
  .checkbox.checked{background:var(--teal);border-color:var(--teal);color:var(--teal-ink);}
  .item-text{font-size:13.5px;flex:1;cursor:pointer;line-height:1.4;}
  .item-text.checked{color:var(--text-dim);text-decoration:line-through;}
  .star-btn{cursor:pointer;flex:0 0 auto;padding:5px;margin:-5px;color:var(--text-dim);display:flex;}
  .star-btn.on{color:var(--gold);}
  .carry-btn{cursor:pointer;flex:0 0 auto;padding:5px;margin:-5px;color:var(--text-dim);display:flex;}
  .carry-btn.on{color:var(--teal);}
  .note-btn{cursor:pointer;flex:0 0 auto;padding:5px;margin:-5px;color:var(--text-dim);display:flex;}
  .note-btn.on{color:var(--text);}
  .item-note-preview{font-size:11px;color:var(--text-dim);margin-top:2px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .item-del{color:var(--text-dim);cursor:pointer;padding:6px;margin:-6px 0 -6px 6px;flex:0 0 auto;display:flex;opacity:0.6;border-left:1px solid var(--line);padding-left:12px;}
  .item-del:active{color:var(--red);opacity:1;transform:scale(0.9);}
  .item-del:hover{opacity:1;color:var(--red);}

  .add-item-row{display:flex;align-items:center;gap:8px;padding-top:9px;margin-top:2px;border-top:1px solid var(--line);}
  .add-item-row input{flex:1;background:transparent;border:none;color:var(--text);font-size:13px;font-family:'Inter',sans-serif;padding:6px 0;outline:none;}
  .add-item-row input::placeholder{color:var(--text-dim);}
  .add-item-btn{color:var(--gold);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;text-transform:uppercase;letter-spacing:0.05em;display:flex;align-items:center;}

  .empty-note{text-align:center;color:var(--text-dim);font-size:12px;padding:16px 0;}
  .info-note{font-size:11.5px;color:var(--text-dim);line-height:1.55;padding:2px 4px 2px;display:flex;gap:8px;align-items:flex-start;}
  .info-note .ic{color:var(--gold);flex:0 0 auto;margin-top:1px;}
  .info-note b{color:var(--text);font-weight:600;}

  .info-hint-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:0 2px;}
  .search-row{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 13px;box-shadow:var(--shadow);}
  .search-row .search-ic{color:var(--text-dim);display:flex;flex:0 0 auto;}
  .search-row input{flex:1;background:transparent;border:none;color:var(--text);font-size:13.5px;font-family:'Inter',sans-serif;outline:none;min-width:0;}
  .search-row input::placeholder{color:var(--text-dim);}
  .search-row .search-clear{color:var(--text-dim);cursor:pointer;display:flex;flex:0 0 auto;padding:2px;}
  .search-row .search-more-btn{color:var(--text-dim);cursor:pointer;display:flex;flex:0 0 auto;padding:4px;margin:-4px 0;border-left:1px solid var(--line);padding-left:10px;}
  .search-row .search-more-btn.active{color:var(--gold);}
  .hint-pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:999px;background:var(--card-2);border:1px solid var(--line);white-space:nowrap;}
  .hint-pill.active{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);}
  .hint-pill.danger{background:var(--red);color:#fff;border-color:var(--red);}
  .hint-pill.gold{color:var(--gold);}
  .hint-pill.teal{color:var(--teal);}
  .hint-pill svg{display:block;}
  .hint-text{font-size:10.5px;color:var(--text-dim);}

  .manage-cat-card{width:100%;background:transparent;border:1px dashed var(--line);color:var(--gold);border-radius:14px;padding:13px;font-family:'Inter',sans-serif;font-weight:700;font-size:12.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;}

  /* Quick-add in sweep tab */
  .quick-add-card{background:var(--card-2);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;}
  .quick-add-label{font-size:11.5px;font-weight:700;margin-bottom:2px;}
  .quick-add-hint{font-weight:400;color:var(--text-dim);font-size:10.5px;}
  .quick-add-row{display:flex;gap:7px;margin-top:8px;}
  .quick-add-row select{flex:0 0 auto;max-width:104px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 6px;color:var(--text);font-size:11.5px;font-family:'Inter',sans-serif;}
  .quick-add-row input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--text);font-size:12.5px;font-family:'Inter',sans-serif;outline:none;min-width:0;}
  .quick-add-row .add-item-btn{background:var(--gold);color:var(--gold-ink);width:32px;height:32px;border-radius:9px;justify-content:center;flex:0 0 auto;}

  .footer{padding:4px 20px 0;}
  .btn-next{width:100%;background:var(--gold);color:var(--gold-ink);border:none;border-radius:14px;padding:16px;font-size:14px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;box-shadow:var(--shadow);transition:transform 0.12s;}
  .btn-next:disabled{background:var(--card-2);color:var(--text-dim);box-shadow:none;cursor:not-allowed;}
  .btn-next:active:not(:disabled){transform:scale(0.98);}

  .overlay{position:fixed;inset:0;background:rgba(6,8,12,0.6);display:none;align-items:flex-end;justify-content:center;z-index:50;}
  .overlay.show{display:flex;}
  .sheet{width:100%;max-width:480px;background:var(--card);border-radius:22px 22px 0 0;padding:22px 20px 26px;border:1px solid var(--line);border-bottom:none;max-height:82vh;overflow-y:auto;}
  .sheet h3{font-family:'Fraunces',serif;font-size:19px;font-weight:600;margin-bottom:16px;}
  .sheet label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);margin-bottom:6px;margin-top:14px;font-weight:600;}
  .sheet label:first-of-type{margin-top:0;}
  .sheet input,.sheet select{width:100%;background:var(--card-2);border:1px solid var(--line);border-radius:11px;padding:12px 13px;color:var(--text);font-size:14px;font-family:'Inter',sans-serif;outline:none;}
  .sheet-actions{display:flex;gap:10px;margin-top:18px;}
  .sheet-actions button{flex:1;border-radius:12px;padding:13px;font-family:'Inter',sans-serif;cursor:pointer;font-size:13.5px;font-weight:700;}
  .btn-cancel{background:transparent;border:1px solid var(--line);color:var(--text-dim);}
  .btn-confirm{background:var(--gold);color:var(--gold-ink);border:none;}

  .trip-list-item{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-top:1px solid var(--line);cursor:pointer;}
  .trip-list-item:first-child{border-top:none;}
  .trip-list-item .tname{font-size:14px;font-weight:700;}
  .trip-list-item .tmeta{font-size:10.5px;color:var(--text-dim);margin-top:2px;}
  .trip-list-item.active .tname{color:var(--gold);}
  .trip-list-item .bullet{color:var(--gold);}
  .btn-new-trip{width:100%;margin-top:14px;background:var(--card-2);border:1px dashed var(--line);color:var(--gold);border-radius:12px;padding:14px;font-family:'Inter',sans-serif;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;}

  .edit-stop-row{display:flex;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line);}
  .edit-stop-row:first-child{border-top:none;}
  .edit-stop-row input[type="text"]{flex:2;}
  .edit-stop-row input[type="number"]{flex:1;}
  .edit-stop-row input{background:var(--card-2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;color:var(--text);font-size:13px;font-family:'Inter',sans-serif;outline:none;width:100%;}
  .edit-stop-del{color:var(--text-dim);cursor:pointer;padding:2px 4px;flex:0 0 auto;display:flex;}
  .edit-stop-del:hover{color:var(--red);}

  /* Category manage sheet */
  .cat-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);}
  .cat-row:first-child{border-top:none;}
  .cat-row .zicon{width:32px;height:32px;}
  .cat-row input{flex:1;background:var(--card-2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;color:var(--text);font-size:13px;font-family:'Inter',sans-serif;outline:none;}
  .cat-row .cat-del{color:var(--text-dim);cursor:pointer;padding:4px;flex:0 0 auto;display:flex;}
  .cat-row .cat-del:hover{color:var(--red);}
  .icon-picker{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;}
  .icon-pick-btn{width:36px;height:36px;border-radius:10px;background:var(--card-2);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-dim);}
  .icon-pick-btn.selected{border-color:var(--gold);color:var(--gold);}

  .loading{display:flex;align-items:center;justify-content:center;height:100vh;color:var(--text-dim);font-size:13px;}

  #undo-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity 0.2s, transform 0.2s;z-index:200;font-size:13px;color:var(--text);max-width:88vw;}
  #undo-toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
  #undo-toast button{background:none;border:none;color:var(--gold);font-weight:700;cursor:pointer;font-size:13px;white-space:nowrap;padding:2px;}

  .loading-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;position:relative;z-index:1;}
  .loading-logo{animation:loadingPulse 1.6s ease-in-out infinite;color:var(--gold);}
  .loading-text{font-family:'Fraunces',serif;font-size:16px;font-weight:600;color:var(--text-dim);letter-spacing:0.01em;}
  @keyframes loadingPulse{0%,100%{opacity:0.35;transform:scale(0.94);}50%{opacity:1;transform:scale(1.05);}}

<script>
const STORAGE_KEY = 'travel-checklist-v8';
const DEFAULT_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzLt-dU6h4I0OrbaLTKbGe8vvM3NT9t3h7IjxPM_barxFLiRlujFfy4LZmSFPhVBvDw/exec';
function cid(){ return Math.random().toString(36).slice(2,10); }

const ICONS = {

  grip:`<circle cx="9" cy="6" r="1.3"/><circle cx="15" cy="6" r="1.3"/><circle cx="9" cy="12" r="1.3"/><circle cx="15" cy="12" r="1.3"/><circle cx="9" cy="18" r="1.3"/><circle cx="15" cy="18" r="1.3"/>`,
  carry:`<path d="M7.5 8V6.5a4.5 4.5 0 019 0V8"/><rect x="4" y="8" width="16" height="12.5" rx="2.5"/><path d="M9 12.3v1.8M15 12.3v1.8"/>`,
  sync:`<path d="M4 12a8 8 0 0113.66-5.66"/><path d="M20 12a8 8 0 01-13.66 5.66"/><path d="M17.3 2.5v4.2h-4.2"/><path d="M6.7 21.5v-4.2h4.2"/>`,
  user:`<circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6"/>`,
  more:`<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>`,
  note:`<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 12h6M9 16h6"/>`,

function icon(name, size, filled){
  size = size || 18;
  const attrs = filled ? `fill="currentColor" stroke="none"` : `fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" ${attrs}>${ICONS[name]||''}</svg>`;
}
const PRESETS = {
  beach: [
    ['clothes','Đồ bơi',false],['clothes','Quần áo mát, chống nắng',false],
    ['toiletries','Kem chống nắng',true],['toiletries','Nha đam / gel làm dịu da',false],
    ['other','Kính râm',true],['other','Mũ / nón rộng vành',false],['other','Dép đi biển',false],['other','Khăn tắm biển',false],
    ['electronics','Sạc điện thoại',false],['electronics','Túi chống nước cho điện thoại',true],
    ['docs','Hộ chiếu / CCCD',true],['docs','Tiền mặt, thẻ ngân hàng',true],
    ['health','Thuốc say sóng (nếu đi tàu/canô)',false],
  ],
  mountain: [
    ['clothes','Áo khoác giữ nhiệt',true],['clothes','Áo mưa / áo gió',false],['clothes','Tất dày',false],
    ['other','Giày trekking',true],['other','Đèn pin / đèn đội đầu',true],['other','Gậy leo núi',false],['other','Bình nước cá nhân',false],
    ['toiletries','Kem chống nắng',false],['toiletries','Thuốc chống côn trùng',true],
    ['electronics','Sạc dự phòng',true],['electronics','Sạc điện thoại',false],
    ['docs','Hộ chiếu / CCCD',true],['docs','Tiền mặt, thẻ ngân hàng',true],
    ['health','Thuốc cá nhân',true],['health','Băng gạc cá nhân',false],
  ],
  business: [
    ['clothes','Áo sơ mi / vest',true],['clothes','Giày tây',false],['clothes','Cà vạt / phụ kiện',false],
    ['electronics','Laptop + sạc',true],['electronics','Sạc điện thoại',true],['electronics','Danh thiếp',false],
    ['docs','Hộ chiếu / CCCD',true],['docs','Tài liệu họp / hợp đồng',true],['docs','Tiền mặt, thẻ ngân hàng',true],
    ['toiletries','Bộ vệ sinh cá nhân gọn',false],
    ['health','Thuốc cá nhân',false],
  ],
  backpack: [
    ['clothes','Quần áo dễ giặt nhanh khô',false],['clothes','Đồ lót/tất dự phòng nhiều bộ',false],
    ['other','Dép tông',false],['other','Túi ngủ / khăn đa năng',false],['other','Ổ khóa vali nhỏ',false],
    ['toiletries','Bàn chải, kem đánh răng',false],['toiletries','Xà phòng đa năng',false],
    ['electronics','Sạc dự phòng',true],['electronics','Sạc điện thoại',true],['electronics','Adapter đa năng',true],
    ['docs','Hộ chiếu / CCCD',true],['docs','Tiền mặt, thẻ ngân hàng',true],
    ['health','Thuốc cá nhân',true],
  ],
};
function buildPackingFromPreset(key){
  return (PRESETS[key]||[]).map(([category,text,flagged])=>({id:cid(), category, text, packed:false, flagged:!!flagged, carry:false, note:''}));
}

const CATEGORY_ICON_CHOICES = ['clothes','toiletries','electronics','docs','health','other','search'];

function seedCategories(){
  return [
    {id:'clothes', name:'Quần áo', ic:'clothes'},
    {id:'toiletries', name:'Vệ sinh cá nhân', ic:'toiletries'},
    {id:'electronics', name:'Điện tử & sạc', ic:'electronics', filled:true},
    {id:'docs', name:'Giấy tờ & tiền', ic:'docs'},
    {id:'health', name:'Y tế', ic:'health'},
    {id:'other', name:'Khác', ic:'other'},
  ];
}
function seedPacking(){
  const mk=(category,text,flagged,carry)=>({id:cid(),category,text,packed:false,flagged:!!flagged,carry:!!carry,note:''});
  return [
    mk('clothes','Quần áo đủ số ngày',false,false),
    mk('toiletries','Bàn chải, kem đánh răng',false,false),
    mk('electronics','Sạc điện thoại',false,false),
    mk('electronics','Sạc laptop',false,false),
    mk('docs','Hộ chiếu / CCCD',true,true),
    mk('docs','Tiền mặt, thẻ ngân hàng',true,true),
    mk('health','Thuốc cá nhân',false,false),
    mk('other','Sạc dự phòng',false,true),
  ];
}
function seedFixedItems(){
  return [
    {id:cid(), text:'Kiểm tra tất cả ổ cắm quanh phòng', checked:false},
    {id:cid(), text:'Giày dép, túi rơi dưới gầm giường/ghế', checked:false},
    {id:cid(), text:'Đồ giặt đang phơi trong toilet', checked:false},
    {id:cid(), text:'Nhìn quanh phòng 1 lượt', checked:false},
    {id:cid(), text:'Ngăn kéo bàn đầu giường / két an toàn', checked:false},
  ];
}
function newTrip(name, packingItems, categories){
  return {
    id:cid(), name: name || 'Chuyến đi mới', activeTab:'packing',
    packing: packingItems || seedPacking(),
    categories: categories || seedCategories(),
    carryChecked: {},
    itemChecked: {},
    fixedItems: seedFixedItems()
  };
}
function defaultState(){
  const t1 = newTrip('Chuyến đi miền Trung', seedPacking());
  const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  return { theme: prefersLight?'light':'dark', activeTripId:t1.id, trips:[t1], webAppUrl:DEFAULT_WEB_APP_URL, users:[], activeUserId:null, activeUserName:'' };
}

let state = null;
let openZones = {};
let showOnlyUnpacked = false;
let packingMoreOpen = false;
let newCatIcon = 'other';
let newCatName = '';

async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    state = raw ? JSON.parse(raw) : defaultState();
    if(!state.theme) state.theme = 'dark';
    if(!state.webAppUrl) state.webAppUrl = DEFAULT_WEB_APP_URL;
    if(!state.users) state.users = [];
    if(state.activeUserId===undefined) state.activeUserId = null;
    state.trips.forEach(t=>{
      if(!t.categories || !t.categories.length){
        t.categories = (state.categories && state.categories.length) ? state.categories.map(c=>({...c})) : seedCategories();
      }
      if(!t.carryChecked) t.carryChecked = {};
      t.packing.forEach(i=>{ if(i.carry===undefined) i.carry=false; if(i.note===undefined) i.note=''; });
      // Migrate old per-stop shape (from before "chặng" was removed) to a single flat checklist
      if(!t.itemChecked || !t.fixedItems){
        if(t.stops && t.stops.length){
          t.itemChecked = t.stops[0].itemChecked || {};
          t.fixedItems = t.stops[0].fixedItems || seedFixedItems();
        }else{
          t.itemChecked = t.itemChecked || {};
          t.fixedItems = t.fixedItems || seedFixedItems();
        }
        delete t.stops;
        delete t.currentStopIndex;
      }
      reassignOrphanItems(t);
    });
    delete state.categories;
  }catch(e){ state = defaultState(); }

  const hasCachedTrip = !!(state.activeUserId && state.trips && state.trips.length>0);
  const hasCachedUsers = !!(state.users && state.users.length>0);
  if(hasCachedTrip || hasCachedUsers){
    render(); // real cached data — safe to show immediately, refresh in background
  }
  // else: keep the branded loading splash on screen until we have real data to show,
  // rather than briefly showing an inaccurate "no users yet" state.

  if(!state.webAppUrl){ if(!hasCachedTrip && !hasCachedUsers) render(); return; }

  if(state.activeUserId){
    // fire both requests in parallel instead of waiting on one then the other
    const [usersResult] = await Promise.allSettled([ loadUsers(), loadTripsForActiveUser(false) ]);
    const usersConfirmed = usersResult.status === 'fulfilled' && usersResult.value === true;
    if(usersConfirmed && state.activeUserId && !state.users.find(u=>u.id===state.activeUserId)){
      state.activeUserId = null; state.activeUserName = '';
    }
    if(uiInteracting){ deferredTripsUpdate = render; } else { render(); }
  }else{
    await loadUsers();
    render(); // refresh welcome screen with the latest user list
  }
}
async function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error('Storage error', e); }
  scheduleCloudPush();
}

function activeTrip(){ return state.trips.find(t=>t.id===state.activeTripId); }
function switchTab(tab){ activeTrip().activeTab = tab; openZones={}; saveState(); render(); }
function toggleZoneOpen(id){ openZones[id] = !openZones[id]; render(); }
function toggleTheme(){ state.theme = state.theme==='light' ? 'dark' : 'light'; saveState(); render(); }

/* Trip switcher */
function showTripSheet(){ renderTripSheet(); document.getElementById('trip-overlay').classList.add('show'); }
function hideTripSheet(){ document.getElementById('trip-overlay').classList.remove('show'); }
function selectTrip(tripId){
  state.activeTripId = tripId; openZones={}; hideTripSheet(); saveState(); render();
}
function deleteTrip(tripId){
  if(state.trips.length<=1) return;
  if(!confirm('Xoá chuyến đi này? Không thể hoàn tác.')) return;
  state.trips = state.trips.filter(t=>t.id!==tripId);
  if(state.activeTripId===tripId) state.activeTripId = state.trips[0].id;
  saveState(); renderTripSheet(); render();
  if(state.webAppUrl && state.activeUserId){
    apiCall('deleteTrip', { tripId }).catch(e=>console.error('deleteTrip cloud error', e));
  }
}
function showNewTripSheet(){
  hideTripSheet(); renderNewTripSheet();
  document.getElementById('newtrip-overlay').classList.add('show');
  setTimeout(()=>{ const el=document.getElementById('nt-name'); if(el) el.focus(); }, 50);
}
function hideNewTripSheet(){ document.getElementById('newtrip-overlay').classList.remove('show'); }
function confirmNewTrip(){
  try{
    const nameInput = document.getElementById('nt-name');
    const name = nameInput.value.trim();
    if(!name){
      nameInput.style.borderColor = 'var(--red)';
      nameInput.placeholder = 'Nhập tên chuyến đi trước đã!';
      nameInput.focus();
      return;
    }
    const source = document.getElementById('nt-source').value;
    let packing, categories;
    if(source.startsWith('preset:')){
      packing = buildPackingFromPreset(source.split(':')[1]);
      categories = seedCategories();
    }else if(source.startsWith('trip:')){
      const t = state.trips.find(t=>t.id===source.split(':')[1]);
      packing = t ? t.packing.map(i=>({id:cid(), category:i.category, text:i.text, packed:false, flagged:i.flagged, carry:i.carry, note:i.note||''})) : seedPacking();
      categories = t && t.categories ? t.categories.map(c=>({...c})) : seedCategories();
    }else{
      packing = seedPacking();
      categories = seedCategories();
    }
    const trip = newTrip(name, packing, categories);
    state.trips.push(trip);
    state.activeTripId = trip.id;
    hideNewTripSheet(); openZones={}; saveState(); render();
  }catch(e){
    console.error('confirmNewTrip error', e);
    alert('Có lỗi khi tạo chuyến: ' + e.message);
  }
}
function renderTripSheet(){
  const html = state.trips.map(t=>{
    const active = t.id===state.activeTripId ? 'active' : '';
    return `<div class="trip-list-item ${active}">
        <div style="flex:1;cursor:pointer;" onclick="selectTrip('${t.id}')"><div class="tname">${escapeHtml(t.name)}</div><div class="tmeta mono">${t.packing.length} món</div></div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="bullet">${t.id===state.activeTripId? icon('check',16) :''}</div>
          ${state.trips.length>1 ? `<div class="cat-del" onclick="event.stopPropagation();deleteTrip('${t.id}')">${icon('close',16)}</div>` : ''}
        </div>
      </div>`;
  }).join('');
  document.getElementById('trip-sheet-body').innerHTML = html;
}
function renderNewTripSheet(){
  const tripOptions = state.trips.map(t=>`<option value="trip:${t.id}">${escapeHtml(t.name)}</option>`).join('');
  document.getElementById('newtrip-sheet-body').innerHTML = `
    <label>Tên chuyến đi</label>
    <input type="text" id="nt-name" placeholder="VD: Chuyến đi Đà Lạt" onkeydown="if(event.key==='Enter'){confirmNewTrip();}">
    <label>Bắt đầu từ</label>
    <select id="nt-source">
      <option value="default">Mặc định (danh sách cơ bản)</option>
      <optgroup label="Mẫu theo loại chuyến">
        <option value="preset:beach">🏖 Đi biển</option>
        <option value="preset:mountain">⛰ Đi núi</option>
        <option value="preset:business">💼 Công tác</option>
        <option value="preset:backpack">🎒 Phượt dài ngày</option>
      </optgroup>
      ${tripOptions ? `<optgroup label="Sao chép từ chuyến đã tạo">${tripOptions}</optgroup>` : ''}
    </select>
  `;
}

/* Edit trip info */
function showEditTripSheet(){ renderEditTripSheet(); document.getElementById('edittrip-overlay').classList.add('show'); }
function hideEditTripSheet(){ document.getElementById('edittrip-overlay').classList.remove('show'); }
function renderEditTripSheet(){
  const trip = activeTrip();
  document.getElementById('edittrip-sheet-body').innerHTML = `
    <label>Tên chuyến đi</label>
    <input type="text" id="et-name" value="${escapeHtml(trip.name)}">
    <div class="manage-cat-card" style="margin-top:14px;" onclick="openCatSheetFromEditTrip()">${icon('pencil',14)} Thêm / sửa / xoá danh mục</div>
  `;
}
function openCatSheetFromEditTrip(){ hideEditTripSheet(); showCatSheet(); }
function confirmEditTrip(){
  const trip = activeTrip();
  const name = document.getElementById('et-name').value.trim();
  if(name) trip.name = name;
  hideEditTripSheet(); saveState(); render();
}

/* Category management */
function showCatSheet(){ newCatIcon='other'; newCatName=''; renderCatSheet(); document.getElementById('cat-overlay').classList.add('show'); }
function hideCatSheet(){ document.getElementById('cat-overlay').classList.remove('show'); render(); }
function commitCategoryName(id, value){
  const c = activeTrip().categories.find(c=>c.id===id);
  if(c && value.trim()){ c.name = value.trim(); saveState(); render(); }
}
function deleteCategory(id){
  if(activeTrip().categories.length<=1) return;
  if(!confirm('Xoá danh mục này? Các món bên trong sẽ chuyển sang danh mục khác.')) return;
  const fallback = activeTrip().categories.find(c=>c.id!==id).id;
  state.trips.forEach(t=>{ t.packing.forEach(i=>{ if(i.category===id) i.category=fallback; }); });
  activeTrip().categories = activeTrip().categories.filter(c=>c.id!==id);
  saveState(); renderCatSheet(); render();
}
function pickNewCatIcon(ic){ newCatIcon = ic; renderCatSheet(); }
function confirmAddCategory(){
  const nameInput = document.getElementById('nc-name');
  const name = nameInput.value.trim();
  if(!name) return;
  activeTrip().categories.push({id:cid(), name, ic:newCatIcon});
  newCatIcon = 'other';
  newCatName = '';
  saveState(); renderCatSheet(); render();
}
function renderCatSheet(){
  const rowsHtml = activeTrip().categories.map(c=>`
    <div class="cat-row">
      <div class="zicon">${icon(c.ic,15,c.filled)}</div>
      <input type="text" value="${escapeHtml(c.name)}" onchange="commitCategoryName('${c.id}', this.value)">
      ${activeTrip().categories.length>1 ? `<div class="cat-del" onclick="deleteCategory('${c.id}')">${icon('close',16)}</div>` : ''}
    </div>
  `).join('');
  const pickerHtml = CATEGORY_ICON_CHOICES.map(ic=>`
    <div class="icon-pick-btn ${newCatIcon===ic?'selected':''}" onclick="pickNewCatIcon('${ic}')">${icon(ic,16)}</div>
  `).join('');
  document.getElementById('cat-sheet-body').innerHTML = `
    <div id="cat-list">${rowsHtml}</div>
    <label>Thêm danh mục mới</label>
    <input type="text" id="nc-name" placeholder="VD: Đồ chơi cho bé" value="${escapeHtml(newCatName)}" oninput="newCatName=this.value">
    <div class="icon-picker">${pickerHtml}</div>
    <div class="sheet-actions" style="margin-top:14px;">
      <button class="btn-confirm" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;" onclick="confirmAddCategory()">${icon('plus',14)} Thêm danh mục</button>
    </div>
  `;
}

/* Packing */
function togglePacked(itemId){ const it=activeTrip().packing.find(i=>i.id===itemId); it.packed=!it.packed; saveState(); render(); }
function toggleFlag(itemId){ const it=activeTrip().packing.find(i=>i.id===itemId); it.flagged=!it.flagged; saveState(); render(); }
function toggleCarry(itemId){ const it=activeTrip().packing.find(i=>i.id===itemId); it.carry=!it.carry; saveState(); render(); }
function filterPackingItems(query){
  query = query.trim().toLowerCase();
  const clearBtn = document.getElementById('pk-search-clear');
  if(clearBtn) clearBtn.style.display = query ? 'flex' : 'none';
  if(!query){
    render(); // restore normal collapsed/expanded state once search is cleared
    return;
  }
  const zones = document.querySelectorAll('#cat-list-container .zone');
  zones.forEach(zone=>{
    let anyMatch = false;
    zone.querySelectorAll('.item[data-itemid]').forEach(itemEl=>{
      const textEl = itemEl.querySelector('.item-text');
      const text = textEl ? textEl.textContent.toLowerCase() : '';
      const match = text.includes(query);
      itemEl.style.display = match ? '' : 'none';
      if(match) anyMatch = true;
    });
    zone.style.display = anyMatch ? '' : 'none';
    if(anyMatch) zone.classList.add('open');
  });
}

/* Drag & drop (packing tab) */
let sortableInstances = [];
function destroySortables(){
  sortableInstances.forEach(s=>{ try{ s.destroy(); }catch(e){} });
  sortableInstances = [];
}
function initPackingSortables(){
  destroySortables();
  if(typeof Sortable === 'undefined') return;
  const catContainer = document.getElementById('cat-list-container');
  if(catContainer){
    sortableInstances.push(Sortable.create(catContainer, {
      handle: '.drag-handle',
      animation: 150,
      onEnd: function(){
        const ids = Array.from(catContainer.children).map(el=>el.dataset.catid);
        const newCats = ids.map(id=>activeTrip().categories.find(c=>c.id===id)).filter(Boolean);
        activeTrip().categories.forEach(c=>{ if(!newCats.includes(c)) newCats.push(c); });
        activeTrip().categories = newCats;
        saveState();
      }
    }));
  }
  document.querySelectorAll('.sortable-items').forEach(list=>{
    sortableInstances.push(Sortable.create(list, {
      group: 'packing-items',
      handle: '.item-drag-handle',
      animation: 150,
      onEnd: function(){ rebuildPackingOrderFromDOM(); }
    }));
  });
}
function rebuildPackingOrderFromDOM(){
  const trip = activeTrip();
  const newPacking = [];
  document.querySelectorAll('.sortable-items').forEach(list=>{
    const catId = list.dataset.catid;
    Array.from(list.children).forEach(el=>{
      const itemId = el.dataset.itemid;
      if(!itemId) return;
      const item = trip.packing.find(i=>i.id===itemId);
      if(item){ item.category = catId; newPacking.push(item); }
    });
  });
  trip.packing.forEach(i=>{ if(!newPacking.includes(i)) newPacking.push(i); });
  trip.packing = newPacking;
  saveState(); render();
}

/* ===== Undo toast (used after destructive actions like delete) ===== */
let undoTimer = null;
let pendingUndoFn = null;
function showUndoToast(message, undoFn){
  clearTimeout(undoTimer);
  let toast = document.getElementById('undo-toast');
  if(!toast){
    toast = document.createElement('div');
    toast.id = 'undo-toast';
    document.body.appendChild(toast);
  }
  toast.innerHTML = `<span>${escapeHtml(message)}</span><button onclick="triggerUndo()">Hoàn tác</button>`;
  toast.classList.add('show');
  pendingUndoFn = undoFn;
  undoTimer = setTimeout(()=>{ toast.classList.remove('show'); pendingUndoFn = null; }, 5000);
}
function triggerUndo(){
  if(pendingUndoFn){ pendingUndoFn(); pendingUndoFn = null; }
  const toast = document.getElementById('undo-toast');
  if(toast) toast.classList.remove('show');
  clearTimeout(undoTimer);
}

/* ===== Multi-user cloud backend (Google Sheets via Apps Script Web App) ===== */
let syncPushTimer = null;
let syncBusy = false;
let pendingLocalEdit = false;
let uiInteracting = false;

async function apiCall(action, payload){
  if(!state.webAppUrl) throw new Error('Chưa cấu hình Web App URL');
  const readActions = ['listUsers','listTrips'];
  if(readActions.includes(action)){
    const params = new URLSearchParams({ action, ...payload });
    const res = await fetch(`${state.webAppUrl}?${params.toString()}`);
    return res.json();
  }
  // POST with text/plain avoids a CORS preflight that Apps Script Web Apps don't handle well
  const res = await fetch(state.webAppUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, ...payload })
  });
  return res.json();
}

function tripToCloudPayload(trip){
  return { name: trip.name, packing: trip.packing, categories: trip.categories, carryChecked: trip.carryChecked, itemChecked: trip.itemChecked, fixedItems: trip.fixedItems };
}
function reassignOrphanItems(trip){
  const validIds = new Set(trip.categories.map(c=>c.id));
  const fallback = trip.categories[0] && trip.categories[0].id;
  if(!fallback) return trip;
  trip.packing.forEach(i=>{ if(!validIds.has(i.category)) i.category = fallback; });
  return trip;
}
function cloudTripToLocal(id, data){
  // Migrate old data shape (per-stop checklists) by folding the first stop's state into the trip level.
  let itemChecked = data.itemChecked;
  let fixedItems = data.fixedItems;
  if(!itemChecked && data.stops && data.stops.length){
    itemChecked = data.stops[0].itemChecked || {};
    fixedItems = data.stops[0].fixedItems || seedFixedItems();
  }
  const trip = {
    id, name: data.name || 'Chuyến đi', activeTab:'packing',
    packing: data.packing || [],
    categories: (data.categories && data.categories.length) ? data.categories : seedCategories(),
    carryChecked: data.carryChecked || {},
    itemChecked: itemChecked || {},
    fixedItems: fixedItems || seedFixedItems()
  };
  return reassignOrphanItems(trip);
}

// Push happens whenever a user is active (all their trips auto-sync — no per-trip toggle needed)
function scheduleCloudPush(){
  if(!state.webAppUrl || !state.activeUserId) return;
  const trip = activeTrip();
  if(!trip) return;
  pendingLocalEdit = true;
  clearTimeout(syncPushTimer);
  syncPushTimer = setTimeout(()=>pushTripToCloud(trip.id), 1200);
}
async function pushTripToCloud(tripId){
  if(!state.webAppUrl || !state.activeUserId || syncBusy) return;
  const trip = state.trips.find(t=>t.id===tripId);
  if(!trip) return;
  syncBusy = true;
  try{
    await apiCall('saveTrip', { tripId: trip.id, userId: state.activeUserId, data: tripToCloudPayload(trip) });
    pendingLocalEdit = false;
  }catch(e){
    console.error('push error', e);
    // keep pendingLocalEdit true and retry shortly — don't silently drop an unsaved change
    clearTimeout(syncPushTimer);
    syncPushTimer = setTimeout(()=>pushTripToCloud(tripId), 5000);
  }
  syncBusy = false;
}

async function loadUsers(){
  if(!state.webAppUrl) return false;
  try{
    const res = await apiCall('listUsers', {});
    if(res.ok){ state.users = res.users; return true; }
    return false;
  }catch(e){ console.error('loadUsers error', e); return false; }
}

async function switchToUser(userId, userName){
  clearTimeout(syncPushTimer);
  pendingLocalEdit = false;
  state.activeUserId = userId;
  state.activeUserName = userName;
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  hideUserSheet();
  showLoadingSplash('Đang chuyển user...');
  await loadTripsForActiveUser(true);
  render();
}
function showLoadingSplash(text){
  document.getElementById('root').innerHTML = `
    <div class="loading-screen">
      <div class="loading-logo">${icon('check',40)}</div>
      <div class="loading-text">${escapeHtml(text||'Đang tải...')}</div>
    </div>
  `;
}

async function loadTripsForActiveUser(isFreshSwitch){
  if(!state.webAppUrl || !state.activeUserId) return;
  if(!isFreshSwitch && pendingLocalEdit) return; // don't clobber a change that hasn't been pushed yet
  try{
    const res = await apiCall('listTrips', { userId: state.activeUserId });
    if(res.ok){
      let newTrips;
      if(res.trips.length === 0){
        const created = await apiCall('createTrip', { userId: state.activeUserId, data: tripToCloudPayload(newTrip('Chuyến đi đầu tiên', seedPacking())) });
        newTrips = [ cloudTripToLocal(created.id, tripToCloudPayload(newTrip('Chuyến đi đầu tiên', seedPacking()))) ];
      }else{
        newTrips = res.trips.map(t=>cloudTripToLocal(t.id, t.data));
      }

      if(isFreshSwitch){
        // genuinely switching to a different user — starting fresh is correct here
        openZones = {};
        state.trips = newTrips;
        state.activeTripId = newTrips[0].id;
      }else{
        // background refresh of the SAME user — keep whatever tab/trip/open-accordion they're on
        const keepId = state.activeTripId;
        const prev = activeTrip();
        const keepTab = prev ? prev.activeTab : 'packing';
        state.trips = newTrips;
        const stillExists = state.trips.find(t=>t.id===keepId);
        if(stillExists){ state.activeTripId = keepId; stillExists.activeTab = keepTab; }
        else state.activeTripId = state.trips[0].id;
        // openZones intentionally left untouched
      }
      saveState();
    }
  }catch(e){ console.error('loadTripsForActiveUser error', e); }
}

  if(btn){ btn.textContent = 'Đang tạo...'; btn.disabled = true; }
  try{

    if(res.ok){
      await loadUsers();
      await switchToUser(res.id, res.name);
    }else{
      showUserSheetError('Server trả lỗi: ' + (res.error || 'không rõ') + (res.message ? ' — ' + res.message : ''));

  finally{ if(btn){ btn.textContent = 'Tạo user'; btn.disabled = false; } }

function renderPackingTab(){
  const trip = activeTrip();
  const total = trip.packing.length;
  const packed = trip.packing.filter(i=>i.packed).length;
  const catHtml = activeTrip().categories.map(cat=>{
    const allItems = trip.packing.filter(i=>i.category===cat.id);
    const cTotal = allItems.length, cDone = allItems.filter(i=>i.packed).length;
    const items = showOnlyUnpacked ? allItems.filter(i=>!i.packed) : allItems;
    if(showOnlyUnpacked && items.length===0) return '';
    const isOpen = showOnlyUnpacked ? true : !!openZones['cat-'+cat.id];
    const doneClass = (cTotal>0 && cDone===cTotal) ? 'zdone' : '';
    const itemsHtml = items.map(item=>`
      <div class="item ${item.flagged?'flag':''}" data-itemid="${item.id}">
        <div class="item-drag-handle">${icon('grip',15)}</div>
        <div class="checkbox ${item.packed?'checked':''}" onclick="togglePacked('${item.id}')">${item.packed?icon('check',12):''}</div>
        <div class="item-text ${item.packed?'checked':''}" onclick="togglePacked('${item.id}')">${escapeHtml(item.text)}${item.note?`<div class="item-note-preview">${escapeHtml(truncateNote(item.note))}</div>`:''}</div>
        <div class="note-btn ${item.note?'on':''}" onclick="openNoteEditor('${item.id}')" title="Sửa & ghi chú">${icon('note',15)}</div>
        <div class="star-btn ${item.flagged?'on':''}" onclick="toggleFlag('${item.id}')" title="Đánh dấu nổi bật">${icon('star',15,item.flagged)}</div>
        <div class="carry-btn ${item.carry?'on':''}" onclick="toggleCarry('${item.id}')" title="Mang theo người khi ra ngoài">${icon('carry',15,item.carry)}</div>
        <div class="item-del" onclick="deletePackingItem('${item.id}')">${icon('close',14)}</div>
      </div>`).join('');
    return `
      <div class="zone ${isOpen?'open':''} ${doneClass}" data-catid="${cat.id}">
        <div class="zone-head" onclick="toggleZoneOpen('cat-${cat.id}')">
          <div class="drag-handle" onclick="event.stopPropagation()">${icon('grip',16)}</div>
          <div class="zicon">${icon(cat.ic,16,cat.filled)}</div>
          <div class="ztitle">${escapeHtml(cat.name)}</div>
          <div class="zprog mono">${cDone}/${cTotal}</div>
          <div class="bulk-icons">
            <div class="bulk-icon-btn check" onclick="event.stopPropagation();bulkSetCategory('${cat.id}',true)" title="Tick tất cả">${icon('check',13)}</div>
            <div class="bulk-icon-btn clear" onclick="event.stopPropagation();bulkSetCategory('${cat.id}',false)" title="Bỏ tất cả">${icon('close',13)}</div>
          </div>
          <div class="zcaret">${icon('chevronDown',14)}</div>
        </div>
        <div class="zone-items"><div class="zone-items-inner sortable-items" data-catid="${cat.id}">
          ${itemsHtml}
        </div>
        <div class="add-item-row">
            <input type="text" placeholder="Thêm món..." id="add-cat-${cat.id}" onkeydown="if(event.key==='Enter'){addPackingItem('${cat.id}', this.value); this.value='';}">
            <div class="add-item-btn" onclick="const el=document.getElementById('add-cat-${cat.id}'); addPackingItem('${cat.id}', el.value); el.value='';">Thêm</div>
          </div>
        </div>
      </div>`;
  }).join('');
  const pkPct = total ? Math.round((packed/total)*100) : 0;
  const pkComplete = total>0 && packed===total;
  renderPassProgress({done:packed, total, completeLabel:'Đã xếp xong vali', activeLabel:'Đang xếp vali...', emptyLabel:'Thêm món để bắt đầu theo dõi', emptyIcon:'other'});
  document.getElementById('tab-body').innerHTML = `
    <div class="body-area">
      <div class="search-row">
        <span class="search-ic">${icon('search',15)}</span>
        <input type="text" id="pk-search" placeholder="Tìm món..." oninput="filterPackingItems(this.value)">
        <span class="search-clear" id="pk-search-clear" onclick="clearPackingSearch()" style="display:none;">${icon('close',13)}</span>
        <span class="search-more-btn ${packingMoreOpen?'active':''}" onclick="togglePackingMore()">${icon('more',16)}</span>
      </div>
      ${packingMoreOpen ? `
      <div class="info-hint-row">
        <span class="hint-pill ${showOnlyUnpacked?'active':''}" onclick="toggleUnpackedFilter()" style="cursor:pointer;">${icon('check',12)} Chỉ hiện chưa xong</span>
        <span class="hint-pill ${resetArmed?'danger':''}" onclick="resetAllPacking()" style="cursor:pointer;">${icon('close',12)} ${resetArmed?'Bấm lần nữa để xoá':'Bỏ tick hết'}</span>
      </div>
      <div class="quick-add-card">
        <div class="quick-add-label">+ Thêm món mới</div>
        <div class="quick-add-row">
          <select id="pk-qa-cat">${activeTrip().categories.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}</select>
          <input type="text" id="pk-qa-text" placeholder="VD: Kem chống nắng" onkeydown="if(event.key==='Enter'){addItemFromPackingQuickAdd();}">
          <div class="add-item-btn" onclick="addItemFromPackingQuickAdd()">${icon('plus',15)}</div>
        </div>
      </div>` : ''}
      <div id="cat-list-container">${catHtml}</div>
    </div>`;
  initPackingSortables();
}

function toggleCarryCheck(itemId){
  const trip = activeTrip();
  trip.carryChecked[itemId] = !trip.carryChecked[itemId];
  saveState(); render();
}
function bulkSetCarryCat(catId, value){
  const trip = activeTrip();
  trip.packing.filter(i=>i.carry && i.category===catId).forEach(i=>{ trip.carryChecked[i.id]=value; });
  saveState(); render();
}
function resetCarryChecklist(){
  activeTrip().carryChecked = {};
  saveState(); render();
}
function renderCarryTab(){
  const trip = activeTrip();
  const carryItems = trip.packing.filter(i=>i.carry);
  const total = carryItems.length;
  const done = carryItems.filter(i=>!!trip.carryChecked[i.id]).length;
  const pct = total ? Math.round((done/total)*100) : 0;
  const complete = total>0 && done===total;

  if(total===0){
    renderPassProgress({done:0, total:0, completeLabel:'', activeLabel:'', emptyLabel:'Chưa có món nào mang theo', emptyIcon:'carry'});
    document.getElementById('tab-body').innerHTML = `
      <div class="body-area">
        <div class="empty-note" style="padding:40px 20px;">Chưa có món nào được đánh dấu "mang theo".<br>Sang tab <b>Đóng gói</b>, bấm icon túi ${icon('carry',13,true)} ở món nào bạn hay mang theo người khi ra ngoài (ví, điện thoại, kem chống nắng...).</div>
      </div>`;
    return;
  }

  const catSectionsHtml = activeTrip().categories.map(cat=>{
    const items = carryItems.filter(i=>i.category===cat.id);
    if(items.length===0) return '';
    const catDone = items.filter(i=>!!trip.carryChecked[i.id]).length;
    const doneClass = (items.length>0 && catDone===items.length) ? 'zdone' : '';
    const itemsHtml = items.map(item=>{
      const checked = !!trip.carryChecked[item.id];
      return `<div class="item ${item.flagged?'flag':''}">
          <div class="checkbox ${checked?'checked':''}" onclick="toggleCarryCheck('${item.id}')">${checked?icon('check',12):''}</div>
          <div class="item-text ${checked?'checked':''}" onclick="toggleCarryCheck('${item.id}')">${escapeHtml(item.text)}${item.note?`<div class="item-note-preview">${escapeHtml(truncateNote(item.note))}</div>`:''}</div>
          <div class="star-btn ${item.flagged?'on':''}" onclick="toggleFlag('${item.id}')" title="Đánh dấu nổi bật">${icon('star',15,item.flagged)}</div>
          <div class="carry-btn on" onclick="toggleCarry('${item.id}')" title="Bỏ khỏi Mang theo">${icon('carry',15,true)}</div>
        </div>`;
    }).join('');
    return `
      <div class="section ${doneClass}">
        <div class="section-head">
          <div class="zicon">${icon(cat.ic,16,cat.filled)}</div>
          <div class="ztitle">${escapeHtml(cat.name)}</div>
          <div class="zprog mono">${catDone}/${items.length}</div>
          <div class="bulk-icons">
            <div class="bulk-icon-btn check" onclick="bulkSetCarryCat('${cat.id}',true)" title="Tick tất cả">${icon('check',13)}</div>
            <div class="bulk-icon-btn clear" onclick="bulkSetCarryCat('${cat.id}',false)" title="Bỏ tất cả">${icon('close',13)}</div>
          </div>
        </div>
        <div class="section-body">${itemsHtml}</div>
      </div>`;
  }).join('');

  renderPassProgress({done, total, completeLabel:'Đủ đồ rồi, ra ngoài thôi', activeLabel:'Kiểm tra trước khi ra ngoài...', emptyLabel:'Chưa có món nào mang theo', emptyIcon:'carry'});
  document.getElementById('tab-body').innerHTML = `
    <div class="body-area">
      <div class="info-hint-row"><span class="hint-text">Dùng xong 1 lượt ra ngoài thì bấm nút bên dưới để reset, dùng lại cho lượt tiếp theo.</span></div>
      ${catSectionsHtml}
    </div>
    <div class="footer">
      <button class="btn-next" onclick="resetCarryChecklist()">Đã kiểm tra xong — reset lại</button>
    </div>
  `;
}
function renderSweepTab(){
  const trip = activeTrip();
  const totalItems = trip.packing.length + trip.fixedItems.length;
  const doneItems = trip.packing.filter(i=>!!trip.itemChecked[i.id]).length + trip.fixedItems.filter(i=>i.checked).length;
  const pct = totalItems ? Math.round((doneItems/totalItems)*100) : 0;
  const complete = totalItems>0 && doneItems===totalItems;

  const catSectionsHtml = activeTrip().categories.map(cat=>{
    const items = trip.packing.filter(i=>i.category===cat.id);
    if(items.length===0) return '';
    const done = items.filter(i=>!!trip.itemChecked[i.id]).length;
    const doneClass = (items.length>0 && done===items.length) ? 'zdone' : '';
    const itemsHtml = items.map(item=>{
      const checked = !!trip.itemChecked[item.id];
      return `<div class="item ${item.flagged?'flag':''}">
          <div class="checkbox ${checked?'checked':''}" onclick="toggleStopItemCheck('${item.id}')">${checked?icon('check',12):''}</div>
          <div class="item-text ${checked?'checked':''}" onclick="toggleStopItemCheck('${item.id}')">${escapeHtml(item.text)}${item.note?`<div class="item-note-preview">${escapeHtml(truncateNote(item.note))}</div>`:''}</div>
          <div class="star-btn ${item.flagged?'on':''}" onclick="toggleFlag('${item.id}')" title="Đánh dấu nổi bật">${icon('star',15,item.flagged)}</div>
        </div>`;
    }).join('');
    return `
      <div class="section ${doneClass}">
        <div class="section-head">
          <div class="zicon">${icon(cat.ic,16,cat.filled)}</div>
          <div class="ztitle">${escapeHtml(cat.name)}</div>
          <div class="zprog mono">${done}/${items.length}</div>
          <div class="bulk-icons">
            <div class="bulk-icon-btn check" onclick="bulkSetCategoryStop('${cat.id}',true)" title="Tick tất cả">${icon('check',13)}</div>
            <div class="bulk-icon-btn clear" onclick="bulkSetCategoryStop('${cat.id}',false)" title="Bỏ tất cả">${icon('close',13)}</div>
          </div>
        </div>
        <div class="section-body">${itemsHtml}</div>
      </div>`;
  }).join('');

  const fixedDone = trip.fixedItems.filter(i=>i.checked).length;
  const fixedDoneClass = (trip.fixedItems.length>0 && fixedDone===trip.fixedItems.length) ? 'zdone' : '';
  const fixedItemsHtml = trip.fixedItems.map(item=>`
      <div class="item">
        <div class="checkbox ${item.checked?'checked':''}" onclick="toggleFixedItem('${item.id}')">${item.checked?icon('check',12):''}</div>
        <div class="item-text ${item.checked?'checked':''}" onclick="toggleFixedItem('${item.id}')">${escapeHtml(item.text)}</div>
        <div class="item-del" onclick="deleteFixedItem('${item.id}')">${icon('close',14)}</div>
      </div>`).join('');

  const catOptionsHtml = activeTrip().categories.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');

  renderPassProgress({done:doneItems, total:totalItems, completeLabel:'Sẵn sàng rời phòng', activeLabel:'Đang quét phòng...', emptyLabel:'Chưa có gì để kiểm tra', emptyIcon:'search'});
  document.getElementById('tab-body').innerHTML = `
    <div class="body-area">
      <div class="quick-add-card">
        <div class="quick-add-label">+ Thêm món cần mang <span class="quick-add-hint">(tự lưu vào tab Đóng gói)</span></div>
        <div class="quick-add-row">
          <select id="qa-cat">${catOptionsHtml}</select>
          <input type="text" id="qa-text" placeholder="VD: Kính bơi" onkeydown="if(event.key==='Enter'){addItemFromSweep();}">
          <div class="add-item-btn" onclick="addItemFromSweep()">${icon('plus',15)}</div>
        </div>
      </div>
      ${catSectionsHtml}
      <div class="section ${fixedDoneClass}">
        <div class="section-head">
          <div class="zicon">${icon('search',16)}</div>
          <div class="ztitle">Kiểm tra chung</div>
          <div class="zprog mono">${fixedDone}/${trip.fixedItems.length}</div>
          <div class="bulk-icons">
            <div class="bulk-icon-btn check" onclick="bulkSetFixed(true)" title="Tick tất cả">${icon('check',13)}</div>
            <div class="bulk-icon-btn clear" onclick="bulkSetFixed(false)" title="Bỏ tất cả">${icon('close',13)}</div>
          </div>
        </div>
        <div class="section-body">
          ${fixedItemsHtml || '<div class="empty-note">Chưa có mục nào</div>'}
          <div class="add-item-row">
            <input type="text" placeholder="Thêm việc cần kiểm tra..." id="add-fixed" onkeydown="if(event.key==='Enter'){addFixedItem(this.value); this.value='';}">
            <div class="add-item-btn" onclick="const el=document.getElementById('add-fixed'); addFixedItem(el.value); el.value='';">Thêm</div>
          </div>
        </div>
      </div>
    </div>
    <div class="footer">
      <button class="btn-next" onclick="resetSweepChecklist()">${complete ? 'Xong — reset để dùng lượt sau' : 'Bỏ tick hết (reset)'}</button>
    </div>
  `;
}

let deferredTripsUpdate = null;

async function refreshTripsSilently(){
  if(!state.webAppUrl || !state.activeUserId) return;
  if(pendingLocalEdit) return; // don't clobber a change that hasn't been pushed yet
  try{
    const res = await apiCall('listTrips', { userId: state.activeUserId });
    if(res.ok && res.trips.length>0){
      const applyUpdate = ()=>{
        const keepId = state.activeTripId;
        const prev = activeTrip();
        const keepTab = prev ? prev.activeTab : 'packing';
        state.trips = res.trips.map(t=>cloudTripToLocal(t.id, t.data));
        const stillExists = state.trips.find(t=>t.id===keepId);
        if(stillExists){ state.activeTripId = keepId; stillExists.activeTab = keepTab; }
        else state.activeTripId = state.trips[0].id;
        saveState(); render();
      };
      if(uiInteracting){ deferredTripsUpdate = applyUpdate; } // apply once the user finishes typing
      else{ applyUpdate(); }
    }
  }catch(e){ console.error('refresh error', e); }
}

document.addEventListener('DOMContentLoaded', loadState);

if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.error('SW register failed', e));
  });
}

document.addEventListener('focusin', (e)=>{
  if(e.target && e.target.tagName === 'INPUT'){
    const root = document.getElementById('root');
    if(root && root.contains(e.target)) uiInteracting = true;
  }
});
document.addEventListener('focusout', (e)=>{
  if(e.target && e.target.tagName === 'INPUT'){
    uiInteracting = false;
    if(deferredTripsUpdate){ const fn = deferredTripsUpdate; deferredTripsUpdate = null; fn(); }
  }
});

document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'hidden' && pendingLocalEdit){
    clearTimeout(syncPushTimer);
    const trip = activeTrip();
    if(trip) pushTripToCloud(trip.id);
  }
  if(document.visibilityState === 'visible' && state && state.webAppUrl && state.activeUserId){
    refreshTripsSilently();
  }
});
</script>
