<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Checklist Du Lịch</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js" defer></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --bg:#0B0E14; --card:#141922; --card-2:#1B222E; --line:#262E3B;
    --gold:#E7A63C; --gold-dim:#7A5220; --gold-ink:#241705;
    --teal:#33B8A6; --teal-ink:#052420;
    --text:#EEF1F6; --text-dim:#7C8698; --red:#E1655C;
    --shadow:0 16px 36px -16px rgba(0,0,0,0.55);
    --blob-op:0.14;
    --gold-tint:rgba(231,166,60,0.10);
  }
  :root[data-theme="light"]{
    --bg:#F3F4F8; --card:#FFFFFF; --card-2:#F7F8FB; --line:#E3E6EE;
    --gold:#B87A1F; --gold-dim:#E7C596; --gold-ink:#FFFFFF;
    --teal:#158775; --teal-ink:#FFFFFF;
    --text:#171922; --text-dim:#6C7686; --red:#C6453E;
    --shadow:0 12px 26px -14px rgba(30,40,60,0.18);
    --blob-op:0.09;
    --gold-tint:rgba(184,122,31,0.08);
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
  body{position:relative;overflow-x:hidden;transition:background 0.25s;}
  body::before{
    content:'';position:fixed;top:-140px;left:50%;transform:translateX(-50%);
    width:520px;height:340px;border-radius:50%;
    background:radial-gradient(circle, var(--gold) 0%, transparent 70%);
    opacity:var(--blob-op);filter:blur(50px);pointer-events:none;z-index:0;
  }
  #root{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:32px;position:relative;z-index:1;}
  .display{font-family:'Fraunces',serif;font-optical-sizing:auto;letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;letter-spacing:0.04em;}
  svg{display:block;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px;}
  .brand{display:flex;align-items:center;gap:8px;color:var(--text-dim);}
  .brand .label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.12em;font-weight:600;}
  .icon-btn{width:36px;height:36px;border-radius:11px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow);color:var(--text);transition:transform 0.12s;}
  .icon-btn:active{transform:scale(0.92);}

  .pass{margin:0 20px 16px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);position:relative;}
  .pass-top{padding:18px 18px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;cursor:pointer;}
  .pass-top .eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:0.14em;color:var(--text-dim);font-weight:600;margin-bottom:6px;}
  .pass-top .tripname{font-size:23px;font-weight:600;line-height:1.15;margin-bottom:8px;}
  .pass-top .meta{font-size:10.5px;color:var(--text-dim);display:flex;align-items:center;gap:5px;}
  .pass-top .meta .chev{color:var(--gold);}
  .pass-edit{width:34px;height:34px;border-radius:10px;background:var(--card-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;color:var(--text);transition:transform 0.12s;}
  .pass-edit:active{transform:scale(0.92);}

  .perf{position:relative;height:0;border-top:1.5px dashed var(--line);}
  .perf::before,.perf::after{content:'';position:absolute;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1px solid var(--line);}
  .perf::before{left:-9px;}
  .perf::after{right:-9px;}

  .tabs{display:flex;padding:6px 18px 0;}
  .tab{flex:1;text-align:center;padding:13px 2px 12px;font-size:11.5px;font-weight:600;color:var(--text-dim);cursor:pointer;border-bottom:2.5px solid transparent;display:flex;align-items:center;justify-content:center;gap:5px;transition:color 0.15s, border-color 0.15s;white-space:nowrap;}
  .tab.active{color:var(--text);border-color:var(--gold);}

  .progress-wrap{padding:0 20px 12px;}
  .progress{position:relative;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow);}
  .progress-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg, var(--gold-dim), var(--gold));transition:width 0.45s cubic-bezier(.2,.8,.2,1);}
  .progress-label{position:relative;z-index:2;height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 16px;}
  .progress-label .status{font-size:12.5px;font-weight:700;}
  .progress-label .count{font-size:11px;color:var(--text-dim);font-weight:600;}
  .progress.complete .status{color:var(--gold-ink);}
  .progress.complete .count{color:var(--gold-ink);opacity:0.75;}

  .stops-row{display:flex;gap:8px;padding:0 20px 12px;overflow-x:auto;}
  .stop-chip{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--text-dim);cursor:pointer;white-space:nowrap;box-shadow:var(--shadow);transition:border-color 0.15s;}
  .stop-chip.active{border-color:var(--gold);color:var(--text);}
  .stop-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--line);flex:0 0 auto;}
  .stop-chip.done .dot{background:var(--teal);}
  .stop-chip .plus-ic{color:var(--gold);display:flex;}

  .body-area{padding:0 20px 20px;display:flex;flex-direction:column;gap:12px;}

  /* Compact bulk icon buttons (replace old text links) */
  .bulk-icons{display:flex;gap:5px;flex:0 0 auto;}
  .bulk-icon-btn{width:29px;height:29px;border-radius:9px;background:var(--card-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-dim);transition:all 0.12s;}
  .bulk-icon-btn:active{transform:scale(0.9);}
  .bulk-icon-btn.check:hover{color:var(--teal);border-color:var(--teal);}
  .bulk-icon-btn.clear:hover{color:var(--red);border-color:var(--red);}

  .zone,.section{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);}
  .zone-head,.section-head{display:flex;align-items:center;gap:10px;padding:12px 14px;}
  .zone-head{cursor:pointer;}
  .zicon{width:34px;height:34px;border-radius:10px;background:var(--card-2);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--gold);}
  .ztitle{flex:1;font-size:13.5px;font-weight:700;}
  .zprog{font-size:10.5px;color:var(--text-dim);font-weight:600;white-space:nowrap;}
  .zone.zdone .zprog,.section.zdone .zprog{color:var(--teal);}
  .zcaret{color:var(--text-dim);transition:transform 0.2s;display:flex;}
  .zone.open .zcaret{transform:rotate(180deg);}

  .zone-items{max-height:0;overflow:hidden;transition:max-height 0.32s ease;padding:0 14px;}
  .zone.open .zone-items{max-height:900px;padding-bottom:12px;}
  .zone-items-inner{padding-left:44px;display:flex;flex-direction:column;}

  .section-body{padding:0 14px 12px 58px;}

  .drag-handle{color:var(--text-dim);cursor:grab;flex:0 0 auto;display:flex;padding:4px;margin:-4px;touch-action:none;}
  .drag-handle:active{cursor:grabbing;}
  .item-drag-handle{color:var(--text-dim);cursor:grab;flex:0 0 auto;display:flex;padding:5px 2px;margin:-5px -2px;opacity:0.45;touch-action:none;}
  .item-drag-handle:active{cursor:grabbing;}
  .sortable-ghost{opacity:0.35;}
  .sortable-chosen .item-drag-handle,.sortable-chosen .drag-handle{opacity:1;}

  .item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);}
  .item:first-child{border-top:none;}
  .item.flag{background:var(--gold-tint);margin:0 -10px;padding:9px 10px;border-radius:9px;}
  .item.flag:first-child{border-top:none;}
  .checkbox{width:23px;height:23px;border-radius:50%;border:1.6px solid var(--text-dim);flex:0 0 auto;display:flex;align-items:center;justify-content:center;cursor:pointer;color:transparent;transition:all 0.15s;}
  .checkbox.checked{background:var(--teal);border-color:var(--teal);color:var(--teal-ink);}
  .item-text{font-size:13.5px;flex:1;cursor:pointer;line-height:1.4;}
  .item-text.checked{color:var(--text-dim);text-decoration:line-through;}
  .star-btn{cursor:pointer;flex:0 0 auto;padding:5px;margin:-5px;color:var(--text-dim);display:flex;}
  .star-btn.on{color:var(--gold);}
  .carry-btn{cursor:pointer;flex:0 0 auto;padding:5px;margin:-5px;color:var(--text-dim);display:flex;}
  .carry-btn.on{color:var(--teal);}
  .item-del{color:var(--text-dim);cursor:pointer;padding:6px;margin:-6px;flex:0 0 auto;display:flex;opacity:0.6;}
  .item-del:hover{opacity:1;color:var(--red);}

  .add-item-row{display:flex;align-items:center;gap:8px;padding-top:9px;margin-top:2px;border-top:1px solid var(--line);}
  .add-item-row input{flex:1;background:transparent;border:none;color:var(--text);font-size:13px;font-family:'Inter',sans-serif;padding:6px 0;outline:none;}
  .add-item-row input::placeholder{color:var(--text-dim);}
  .add-item-btn{color:var(--gold);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;text-transform:uppercase;letter-spacing:0.05em;display:flex;align-items:center;}

  .empty-note{text-align:center;color:var(--text-dim);font-size:12px;padding:16px 0;}
  .info-note{font-size:11.5px;color:var(--text-dim);line-height:1.55;padding:2px 4px 2px;display:flex;gap:8px;align-items:flex-start;}
  .info-note .ic{color:var(--gold);flex:0 0 auto;margin-top:1px;}
  .info-note b{color:var(--text);font-weight:600;}

  .manage-cat-card{width:100%;background:transparent;border:1px dashed var(--line);color:var(--gold);border-radius:14px;padding:13px;font-family:'Inter',sans-serif;font-weight:700;font-size:12.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;}

  /* Quick-add in sweep tab */
  .quick-add-card{background:var(--card-2);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;}
  .quick-add-label{font-size:11.5px;font-weight:700;margin-bottom:2px;}
  .quick-add-hint{font-weight:400;color:var(--text-dim);font-size:10.5px;}
  .quick-add-row{display:flex;gap:7px;margin-top:8px;}
  .quick-add-row select{flex:0 0 auto;max-width:104px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 6px;color:var(--text);font-size:11.5px;font-family:'Inter',sans-serif;}
  .quick-add-row input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--text);font-size:12.5px;font-family:'Inter',sans-serif;outline:none;min-width:0;}
  .quick-add-row .add-item-btn{background:var(--gold);color:var(--gold-ink);width:32px;height:32px;border-radius:9px;justify-content:center;flex:0 0 auto;}

  .footer{padding:4px 20px 0;}
  .btn-next{width:100%;background:var(--gold);color:var(--gold-ink);border:none;border-radius:14px;padding:16px;font-size:14px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;box-shadow:var(--shadow);transition:transform 0.12s;}
  .btn-next:disabled{background:var(--card-2);color:var(--text-dim);box-shadow:none;cursor:not-allowed;}
  .btn-next:active:not(:disabled){transform:scale(0.98);}

  .overlay{position:fixed;inset:0;background:rgba(6,8,12,0.6);display:none;align-items:flex-end;justify-content:center;z-index:50;}
  .overlay.show{display:flex;}
  .sheet{width:100%;max-width:480px;background:var(--card);border-radius:22px 22px 0 0;padding:22px 20px 26px;border:1px solid var(--line);border-bottom:none;max-height:82vh;overflow-y:auto;}
  .sheet h3{font-family:'Fraunces',serif;font-size:19px;font-weight:600;margin-bottom:16px;}
  .sheet label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);margin-bottom:6px;margin-top:14px;font-weight:600;}
  .sheet label:first-of-type{margin-top:0;}
  .sheet input,.sheet select{width:100%;background:var(--card-2);border:1px solid var(--line);border-radius:11px;padding:12px 13px;color:var(--text);font-size:14px;font-family:'Inter',sans-serif;outline:none;}
  .sheet-actions{display:flex;gap:10px;margin-top:18px;}
  .sheet-actions button{flex:1;border-radius:12px;padding:13px;font-family:'Inter',sans-serif;cursor:pointer;font-size:13.5px;font-weight:700;}
  .btn-cancel{background:transparent;border:1px solid var(--line);color:var(--text-dim);}
  .btn-confirm{background:var(--gold);color:var(--gold-ink);border:none;}

  .trip-list-item{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-top:1px solid var(--line);cursor:pointer;}
  .trip-list-item:first-child{border-top:none;}
  .trip-list-item .tname{font-size:14px;font-weight:700;}
  .trip-list-item .tmeta{font-size:10.5px;color:var(--text-dim);margin-top:2px;}
  .trip-list-item.active .tname{color:var(--gold);}
  .trip-list-item .bullet{color:var(--gold);}
  .btn-new-trip{width:100%;margin-top:14px;background:var(--card-2);border:1px dashed var(--line);color:var(--gold);border-radius:12px;padding:14px;font-family:'Inter',sans-serif;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;}

  .edit-stop-row{display:flex;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line);}
  .edit-stop-row:first-child{border-top:none;}
  .edit-stop-row input[type="text"]{flex:2;}
  .edit-stop-row input[type="number"]{flex:1;}
  .edit-stop-row input{background:var(--card-2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;color:var(--text);font-size:13px;font-family:'Inter',sans-serif;outline:none;width:100%;}
  .edit-stop-del{color:var(--text-dim);cursor:pointer;padding:2px 4px;flex:0 0 auto;display:flex;}
  .edit-stop-del:hover{color:var(--red);}

  /* Category manage sheet */
  .cat-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);}
  .cat-row:first-child{border-top:none;}
  .cat-row .zicon{width:32px;height:32px;}
  .cat-row input{flex:1;background:var(--card-2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;color:var(--text);font-size:13px;font-family:'Inter',sans-serif;outline:none;}
  .cat-row .cat-del{color:var(--text-dim);cursor:pointer;padding:4px;flex:0 0 auto;display:flex;}
  .cat-row .cat-del:hover{color:var(--red);}
  .icon-picker{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;}
  .icon-pick-btn{width:36px;height:36px;border-radius:10px;background:var(--card-2);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-dim);}
  .icon-pick-btn.selected{border-color:var(--gold);color:var(--gold);}

  .loading{display:flex;align-items:center;justify-content:center;height:100vh;color:var(--text-dim);font-size:13px;}
</style>
</head>

let state = null;
let openZones = {};
let newCatIcon = 'other';

async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    state = raw ? JSON.parse(raw) : defaultState();
    if(!state.theme) state.theme = 'dark';
    if(!state.webAppUrl) state.webAppUrl = DEFAULT_WEB_APP_URL;
    if(!state.users) state.users = [];
    if(state.activeUserId===undefined) state.activeUserId = null;
    if(!state.categories) state.categories = seedCategories();
    state.trips.forEach(t=>{
      if(!t.carryChecked) t.carryChecked = {};
      t.packing.forEach(i=>{ if(i.carry===undefined) i.carry=false; });
    });
  }catch(e){ state = defaultState(); }
  render();
  await loadUsers();
  if(state.activeUserId && state.users.find(u=>u.id===state.activeUserId)){
    await loadTripsForActiveUser();
    render();
  }else{
    showUserSheet();
  }
}
async function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error('Storage error', e); }
  scheduleCloudPush();
}

let sortableInstances = [];
function destroySortables(){
  sortableInstances.forEach(s=>{ try{ s.destroy(); }catch(e){} });
  sortableInstances = [];
}
function initPackingSortables(){
  destroySortables();
  if(typeof Sortable === 'undefined') return;
  const catContainer = document.getElementById('cat-list-container');
  if(catContainer){
    sortableInstances.push(Sortable.create(catContainer, {
      handle: '.drag-handle',
      animation: 150,
      onEnd: function(){
        const ids = Array.from(catContainer.children).map(el=>el.dataset.catid);
        const newCats = ids.map(id=>state.categories.find(c=>c.id===id)).filter(Boolean);
        state.categories.forEach(c=>{ if(!newCats.includes(c)) newCats.push(c); });
        state.categories = newCats;
        saveState();
      }
    }));
  }
  document.querySelectorAll('.sortable-items').forEach(list=>{
    sortableInstances.push(Sortable.create(list, {
      group: 'packing-items',
      handle: '.item-drag-handle',
      animation: 150,
      onEnd: function(){ rebuildPackingOrderFromDOM(); }
    }));
  });
}
function rebuildPackingOrderFromDOM(){
  const trip = activeTrip();
  const newPacking = [];
  document.querySelectorAll('.sortable-items').forEach(list=>{
    const catId = list.dataset.catid;
    Array.from(list.children).forEach(el=>{
      const itemId = el.dataset.itemid;
      if(!itemId) return;
      const item = trip.packing.find(i=>i.id===itemId);
      if(item){ item.category = catId; newPacking.push(item); }
    });
  });
  trip.packing.forEach(i=>{ if(!newPacking.includes(i)) newPacking.push(i); });
  trip.packing = newPacking;
  saveState(); render();
}

/* ===== Multi-user cloud backend (Google Sheets via Apps Script Web App) ===== */
let syncPushTimer = null;
let syncBusy = false;

async function apiCall(action, payload){
  if(!state.webAppUrl) throw new Error('Chưa cấu hình Web App URL');
  const readActions = ['listUsers','listTrips'];
  if(readActions.includes(action)){
    const params = new URLSearchParams({ action, ...payload });
    const res = await fetch(`${state.webAppUrl}?${params.toString()}`);
    return res.json();
  }
  // POST with text/plain avoids a CORS preflight that Apps Script Web Apps don't handle well
  const res = await fetch(state.webAppUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, ...payload })
  });
  return res.json();
}

function tripToCloudPayload(trip){
  return { name: trip.name, packing: trip.packing, stops: trip.stops, carryChecked: trip.carryChecked };
}
function cloudTripToLocal(id, data){
  return {
    id, name: data.name || 'Chuyến đi', activeTab:'packing', currentStopIndex:0,
    packing: data.packing || [], stops: data.stops && data.stops.length ? data.stops : [{ id:cid(), name:'Chặng 1', nights:1, fixedItems:seedFixedItems(), itemChecked:{} }],
    carryChecked: data.carryChecked || {}
  };
}

// Push happens whenever a user is active (all their trips auto-sync — no per-trip toggle needed)
function scheduleCloudPush(){
  if(!state.webAppUrl || !state.activeUserId) return;
  const trip = activeTrip();
  if(!trip) return;
  clearTimeout(syncPushTimer);
  syncPushTimer = setTimeout(()=>pushTripToCloud(trip.id), 1200);
}
async function pushTripToCloud(tripId){
  if(!state.webAppUrl || !state.activeUserId || syncBusy) return;
  const trip = state.trips.find(t=>t.id===tripId);
  if(!trip) return;
  syncBusy = true;
  try{
    await apiCall('saveTrip', { tripId: trip.id, userId: state.activeUserId, data: tripToCloudPayload(trip) });
  }catch(e){ console.error('push error', e); }
  syncBusy = false;
}

async function loadUsers(){
  if(!state.webAppUrl) return;
  try{
    const res = await apiCall('listUsers', {});
    if(res.ok) state.users = res.users;
  }catch(e){ console.error('loadUsers error', e); }
}

async function switchToUser(userId, userName){
  state.activeUserId = userId;
  state.activeUserName = userName;
  saveState();
  hideUserSheet();
  await loadTripsForActiveUser();
  render();
}

async function loadTripsForActiveUser(){
  if(!state.webAppUrl || !state.activeUserId) return;
  try{
    const res = await apiCall('listTrips', { userId: state.activeUserId });
    if(res.ok){
      if(res.trips.length === 0){
        const created = await apiCall('createTrip', { userId: state.activeUserId, data: tripToCloudPayload(newTrip('Chuyến đi đầu tiên', seedPacking())) });
        state.trips = [ cloudTripToLocal(created.id, tripToCloudPayload(newTrip('Chuyến đi đầu tiên', seedPacking()))) ];
      }else{
        state.trips = res.trips.map(t=>cloudTripToLocal(t.id, t.data));
      }
      openZones = {};
      state.activeTripId = state.trips[0].id;
      saveState();
    }
  }catch(e){ console.error('loadTripsForActiveUser error', e); }
}

function showUserSheet(){ renderUserSheet(); document.getElementById('sync-overlay').classList.add('show'); loadUsers().then(renderUserSheet); }
function hideUserSheet(){ document.getElementById('sync-overlay').classList.remove('show'); }
async function createUser(){
  const nameInput = document.getElementById('sy-new-name');
  const name = nameInput.value.trim();
  if(!name) return;
  const btn = document.getElementById('sy-create-btn');
  if(btn){ btn.textContent = 'Đang tạo...'; btn.disabled = true; }
  try{
    const res = await apiCall('createUser', { name });
    if(res.ok){
      await loadUsers();
      await switchToUser(res.id, res.name);
    }
  }catch(e){ alert('Lỗi kết nối tới máy chủ: ' + e.message); }
  finally{ if(btn){ btn.textContent = 'Tạo user'; btn.disabled = false; } }
}

    const active = u.id===state.activeUserId ? 'active' : '';
    return `<div class="trip-list-item ${active}" onclick="switchToUser('${u.id}', '${escapeHtml(u.name).replace(/'/g,"\\'")}')">
        <div class="tname">${escapeHtml(u.name)}</div>
        <div class="bullet">${u.id===state.activeUserId? icon('check',16) :''}</div>
      </div>`;
  }).join('') || `<div class="empty-note">Chưa có user nào — tạo user đầu tiên bên dưới.</div>`;

  document.getElementById('sync-sheet-body').innerHTML = `
    <label>Chọn user</label>
    <div id="sy-users-list">${usersHtml}</div>
    <label>Tạo user mới</label>
    <div style="display:flex;gap:8px;">
      <input type="text" id="sy-new-name" placeholder="Tên của bạn" style="flex:1;" onkeydown="if(event.key==='Enter'){createUser();}">
      <button class="btn-confirm" id="sy-create-btn" style="flex:0 0 auto;padding:12px 16px;" onclick="createUser()">Tạo user</button>
    </div>
  `;
}

/* Render */
function render(){
  document.documentElement.setAttribute('data-theme', state.theme==='light' ? 'light' : 'dark');
  const trip = activeTrip();
  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="topbar">
      <div class="brand">${icon('other',15)}<span class="label">${state.activeUserName ? escapeHtml(state.activeUserName) : 'Checklist du lịch'}</span></div>
      <div style="display:flex;gap:8px;">
        <div class="icon-btn" onclick="showUserSheet()" title="Người dùng">${icon('sync',17)}</div>
        <div class="icon-btn" onclick="toggleTheme()">${icon(state.theme==='light'?'moon':'sun',17)}</div>
      </div>
    </div>

    <div class="pass">
      <div class="pass-top" onclick="showTripSheet()">
        <div>
          <div class="eyebrow">Chuyến đi hiện tại</div>
          <div class="tripname display">${escapeHtml(trip.name)}</div>
          <div class="meta mono">${trip.stops.length} CHẶNG · ${trip.packing.length} MÓN <span class="chev">${icon('chevronDown',12)}</span></div>
        </div>
        <div class="pass-edit" onclick="event.stopPropagation(); showEditTripSheet()">${icon('pencil',16)}</div>
      </div>
      <div class="perf"></div>
      <div class="tabs">
        <div class="tab ${trip.activeTab==='packing'?'active':''}" onclick="switchTab('packing')">${icon('other',14)} Đóng gói</div>
        <div class="tab ${trip.activeTab==='carry'?'active':''}" onclick="switchTab('carry')">${icon('carry',14)} Mang theo</div>
        <div class="tab ${trip.activeTab==='sweep'?'active':''}" onclick="switchTab('sweep')">${icon('search',14)} Rời phòng</div>
      </div>
    </div>

    <div id="tab-body"></div>
  `;
  if(trip.activeTab==='packing') renderPackingTab();
  else if(trip.activeTab==='carry'){ destroySortables(); renderCarryTab(); }
  else { destroySortables(); renderSweepTab(); }
  document.getElementById('overlay').onclick=(e)=>{ if(e.target.id==='overlay') hideAddStopSheet(); };
  document.getElementById('trip-overlay').onclick=(e)=>{ if(e.target.id==='trip-overlay') hideTripSheet(); };
  document.getElementById('newtrip-overlay').onclick=(e)=>{ if(e.target.id==='newtrip-overlay') hideNewTripSheet(); };
  document.getElementById('edittrip-overlay').onclick=(e)=>{ if(e.target.id==='edittrip-overlay') hideEditTripSheet(); };
  document.getElementById('cat-overlay').onclick=(e)=>{ if(e.target.id==='cat-overlay') hideCatSheet(); };
  document.getElementById('sync-overlay').onclick=(e)=>{ if(e.target.id==='sync-overlay') hideUserSheet(); };
}

function renderPackingTab(){
  const trip = activeTrip();
  const total = trip.packing.length;
  const packed = trip.packing.filter(i=>i.packed).length;
  const catHtml = state.categories.map(cat=>{
    const items = trip.packing.filter(i=>i.category===cat.id);
    const cTotal = items.length, cDone = items.filter(i=>i.packed).length;
    const isOpen = !!openZones['cat-'+cat.id];
    const doneClass = (cTotal>0 && cDone===cTotal) ? 'zdone' : '';
    const itemsHtml = items.map(item=>`
      <div class="item ${item.flagged?'flag':''}" data-itemid="${item.id}">
        <div class="item-drag-handle">${icon('grip',15)}</div>
        <div class="checkbox ${item.packed?'checked':''}" onclick="togglePacked('${item.id}')">${item.packed?icon('check',12):''}</div>
        <div class="item-text ${item.packed?'checked':''}" onclick="togglePacked('${item.id}')">${escapeHtml(item.text)}</div>
        <div class="star-btn ${item.flagged?'on':''}" onclick="toggleFlag('${item.id}')" title="Đánh dấu nổi bật">${icon('star',15,item.flagged)}</div>
        <div class="carry-btn ${item.carry?'on':''}" onclick="toggleCarry('${item.id}')" title="Mang theo người khi ra ngoài">${icon('carry',15,item.carry)}</div>
        <div class="item-del" onclick="deletePackingItem('${item.id}')">${icon('close',14)}</div>
      </div>`).join('');
    return `
      <div class="zone ${isOpen?'open':''} ${doneClass}" data-catid="${cat.id}">
        <div class="zone-head" onclick="toggleZoneOpen('cat-${cat.id}')">
          <div class="drag-handle" onclick="event.stopPropagation()">${icon('grip',16)}</div>
          <div class="zicon">${icon(cat.ic,16,cat.filled)}</div>
          <div class="ztitle">${escapeHtml(cat.name)}</div>
          <div class="zprog mono">${cDone}/${cTotal}</div>
          <div class="bulk-icons">
            <div class="bulk-icon-btn check" onclick="event.stopPropagation();bulkSetCategory('${cat.id}',true)" title="Tick tất cả">${icon('check',13)}</div>
            <div class="bulk-icon-btn clear" onclick="event.stopPropagation();bulkSetCategory('${cat.id}',false)" title="Bỏ tất cả">${icon('close',13)}</div>
          </div>
          <div class="zcaret">${icon('chevronDown',14)}</div>
        </div>
        <div class="zone-items"><div class="zone-items-inner sortable-items" data-catid="${cat.id}">
          ${itemsHtml}
        </div>
        ${cTotal===0 ? '<div class="empty-note">Chưa có món nào — kéo món từ danh mục khác vào đây, hoặc thêm mới bên dưới</div>' : ''}
        <div class="add-item-row">
            <input type="text" placeholder="Thêm món..." id="add-cat-${cat.id}" onkeydown="if(event.key==='Enter'){addPackingItem('${cat.id}', this.value); this.value='';}">
            <div class="add-item-btn" onclick="const el=document.getElementById('add-cat-${cat.id}'); addPackingItem('${cat.id}', el.value); el.value='';">Thêm</div>
          </div>
        </div>
      </div>`;
  }).join('');
  const pkPct = total ? Math.round((packed/total)*100) : 0;
  const pkComplete = total>0 && packed===total;
  document.getElementById('tab-body').innerHTML = `
    <div class="progress-wrap">
      <div class="progress ${pkComplete?'complete':''}">
        <div class="progress-fill" style="width:${pkPct}%"></div>
        <div class="progress-label">
          <div class="status">${pkComplete ? 'Đã xếp xong vali' : 'Đang xếp vali...'}</div>
          <div class="count mono">${packed}/${total}</div>
        </div>
      </div>
    </div>
    <div class="body-area">
      <div class="info-note"><span class="ic">${icon('star',14,true)}</span><span>Mọi món đều tự hiện trong <b>Rời phòng</b>, cùng thứ tự danh mục như ở đây. Bấm ngôi sao để đánh dấu nổi bật, bấm túi ${icon('carry',12,true)} để đưa vào tab <b>Mang theo</b> — checklist riêng khi ra ngoài tham quan.</span></div>
      <div id="cat-list-container">${catHtml}</div>
      <div class="manage-cat-card" onclick="showCatSheet()">${icon('pencil',14)} Thêm / sửa / xoá danh mục</div>
    </div>`;
  initPackingSortables();
}

function toggleCarryCheck(itemId){
  const trip = activeTrip();
  trip.carryChecked[itemId] = !trip.carryChecked[itemId];
  saveState(); render();
}
function bulkSetCarryCat(catId, value){
  const trip = activeTrip();
  trip.packing.filter(i=>i.carry && i.category===catId).forEach(i=>{ trip.carryChecked[i.id]=value; });
  saveState(); render();
}
function resetCarryChecklist(){
  activeTrip().carryChecked = {};
  saveState(); render();
}
function renderCarryTab(){
  const trip = activeTrip();
  const carryItems = trip.packing.filter(i=>i.carry);
  const total = carryItems.length;
  const done = carryItems.filter(i=>!!trip.carryChecked[i.id]).length;
  const pct = total ? Math.round((done/total)*100) : 0;
  const complete = total>0 && done===total;

  if(total===0){
    document.getElementById('tab-body').innerHTML = `
      <div class="body-area">
        <div class="empty-note" style="padding:40px 20px;">Chưa có món nào được đánh dấu "mang theo".<br>Sang tab <b>Đóng gói</b>, bấm icon túi ${icon('carry',13,true)} ở món nào bạn hay mang theo người khi ra ngoài (ví, điện thoại, kem chống nắng...).</div>
      </div>`;
    return;
  }

  const catSectionsHtml = state.categories.map(cat=>{
    const items = carryItems.filter(i=>i.category===cat.id);
    if(items.length===0) return '';
    const catDone = items.filter(i=>!!trip.carryChecked[i.id]).length;
    const doneClass = (items.length>0 && catDone===items.length) ? 'zdone' : '';
    const itemsHtml = items.map(item=>{
      const checked = !!trip.carryChecked[item.id];
      return `<div class="item ${item.flagged?'flag':''}">
          <div class="checkbox ${checked?'checked':''}" onclick="toggleCarryCheck('${item.id}')">${checked?icon('check',12):''}</div>
          <div class="item-text ${checked?'checked':''}" onclick="toggleCarryCheck('${item.id}')">${escapeHtml(item.text)}</div>
        </div>`;
    }).join('');
    return `
      <div class="section ${doneClass}">
        <div class="section-head">
          <div class="zicon">${icon(cat.ic,16,cat.filled)}</div>
          <div class="ztitle">${escapeHtml(cat.name)}</div>
          <div class="zprog mono">${catDone}/${items.length}</div>
          <div class="bulk-icons">
            <div class="bulk-icon-btn check" onclick="bulkSetCarryCat('${cat.id}',true)" title="Tick tất cả">${icon('check',13)}</div>
            <div class="bulk-icon-btn clear" onclick="bulkSetCarryCat('${cat.id}',false)" title="Bỏ tất cả">${icon('close',13)}</div>
          </div>
        </div>
        <div class="section-body">${itemsHtml}</div>
      </div>`;
  }).join('');

  document.getElementById('tab-body').innerHTML = `
    <div class="progress-wrap">
      <div class="progress ${complete?'complete':''}">
        <div class="progress-fill" style="width:${pct}%"></div>
        <div class="progress-label">
          <div class="status">${complete ? 'Đủ đồ rồi, ra ngoài thôi' : 'Kiểm tra trước khi ra ngoài...'}</div>
          <div class="count mono">${done}/${total}</div>
        </div>
      </div>
    </div>
    <div class="body-area">
      <div class="info-note"><span class="ic">${icon('carry',14,true)}</span><span>Checklist đồ mang theo người khi đi tham quan/di chuyển — tách riêng khỏi vali lớn. Dùng xong 1 lượt thì bấm nút bên dưới để reset, dùng lại cho lượt ra ngoài tiếp theo.</span></div>
      ${catSectionsHtml}
    </div>
    <div class="footer">
      <button class="btn-next" onclick="resetCarryChecklist()">Đã kiểm tra xong — reset lại</button>
    </div>
  `;
}
function renderSweepTab(){
  const trip = activeTrip();
  const stop = currentStop();
  const totalItems = trip.packing.length + stop.fixedItems.length;
  const doneItems = trip.packing.filter(i=>!!stop.itemChecked[i.id]).length + stop.fixedItems.filter(i=>i.checked).length;
  const pct = totalItems ? Math.round((doneItems/totalItems)*100) : 0;
  const complete = totalItems>0 && doneItems===totalItems;

  const stopsHtml = trip.stops.map((s,idx)=>{
    const sTotal = trip.packing.length + s.fixedItems.length;
    const sDone = trip.packing.filter(i=>s.itemChecked[i.id]).length + s.fixedItems.filter(i=>i.checked).length;
    const isDone = sTotal>0 && sDone===sTotal;
    const active = idx===trip.currentStopIndex ? 'active' : '';
    return `<div class="stop-chip ${active} ${isDone?'done':''}" onclick="switchStop(${idx})"><div class="dot"></div>${escapeHtml(s.name)}</div>`;
  }).join('') + `<div class="stop-chip" onclick="showAddStopSheet()"><span class="plus-ic">${icon('plus',13)}</span> Thêm chặng</div>`;

  const catSectionsHtml = state.categories.map(cat=>{
    const items = trip.packing.filter(i=>i.category===cat.id);
    if(items.length===0) return '';
    const done = items.filter(i=>!!stop.itemChecked[i.id]).length;
    const doneClass = (items.length>0 && done===items.length) ? 'zdone' : '';
    const itemsHtml = items.map(item=>{
      const checked = !!stop.itemChecked[item.id];
      return `<div class="item ${item.flagged?'flag':''}">
          <div class="checkbox ${checked?'checked':''}" onclick="toggleStopItemCheck('${item.id}')">${checked?icon('check',12):''}</div>
          <div class="item-text ${checked?'checked':''}" onclick="toggleStopItemCheck('${item.id}')">${escapeHtml(item.text)}</div>
          <div class="star-btn ${item.flagged?'on':''}" onclick="toggleFlag('${item.id}')" title="Đánh dấu nổi bật">${icon('star',15,item.flagged)}</div>
        </div>`;
    }).join('');
    return `
      <div class="section ${doneClass}">
        <div class="section-head">
          <div class="zicon">${icon(cat.ic,16,cat.filled)}</div>
          <div class="ztitle">${escapeHtml(cat.name)}</div>
          <div class="zprog mono">${done}/${items.length}</div>
          <div class="bulk-icons">
            <div class="bulk-icon-btn check" onclick="bulkSetCategoryStop('${cat.id}',true)" title="Tick tất cả">${icon('check',13)}</div>
            <div class="bulk-icon-btn clear" onclick="bulkSetCategoryStop('${cat.id}',false)" title="Bỏ tất cả">${icon('close',13)}</div>
          </div>
        </div>
        <div class="section-body">${itemsHtml}</div>
      </div>`;
  }).join('');

  const fixedDone = stop.fixedItems.filter(i=>i.checked).length;
  const fixedDoneClass = (stop.fixedItems.length>0 && fixedDone===stop.fixedItems.length) ? 'zdone' : '';
  const fixedItemsHtml = stop.fixedItems.map(item=>`
      <div class="item">
        <div class="checkbox ${item.checked?'checked':''}" onclick="toggleFixedItem('${item.id}')">${item.checked?icon('check',12):''}</div>
        <div class="item-text ${item.checked?'checked':''}" onclick="toggleFixedItem('${item.id}')">${escapeHtml(item.text)}</div>
        <div class="item-del" onclick="deleteFixedItem('${item.id}')">${icon('close',14)}</div>
      </div>`).join('');

  const catOptionsHtml = state.categories.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');

  document.getElementById('tab-body').innerHTML = `
    <div class="progress-wrap">
      <div class="progress ${complete?'complete':''}">
        <div class="progress-fill" style="width:${pct}%"></div>
        <div class="progress-label">
          <div class="status">${complete ? 'Sẵn sàng rời phòng' : 'Đang quét phòng...'}</div>
          <div class="count mono">${doneItems}/${totalItems}</div>
        </div>
      </div>
    </div>
    <div class="stops-row">${stopsHtml}</div>
    <div class="body-area">
      <div class="quick-add-card">
        <div class="quick-add-label">+ Thêm món cần mang <span class="quick-add-hint">(tự lưu vào tab Đóng gói)</span></div>
        <div class="quick-add-row">
          <select id="qa-cat">${catOptionsHtml}</select>
          <input type="text" id="qa-text" placeholder="VD: Kính bơi" onkeydown="if(event.key==='Enter'){addItemFromSweep();}">
          <div class="add-item-btn" onclick="addItemFromSweep()">${icon('plus',15)}</div>
        </div>
      </div>
      ${catSectionsHtml}
      <div class="section ${fixedDoneClass}">
        <div class="section-head">
          <div class="zicon">${icon('search',16)}</div>
          <div class="ztitle">Kiểm tra chung</div>
          <div class="zprog mono">${fixedDone}/${stop.fixedItems.length}</div>
          <div class="bulk-icons">
            <div class="bulk-icon-btn check" onclick="bulkSetFixed(true)" title="Tick tất cả">${icon('check',13)}</div>
            <div class="bulk-icon-btn clear" onclick="bulkSetFixed(false)" title="Bỏ tất cả">${icon('close',13)}</div>
          </div>
        </div>
        <div class="section-body">
          ${fixedItemsHtml || '<div class="empty-note">Chưa có mục nào</div>'}
          <div class="add-item-row">
            <input type="text" placeholder="Thêm việc cần kiểm tra..." id="add-fixed" onkeydown="if(event.key==='Enter'){addFixedItem(this.value); this.value='';}">
            <div class="add-item-btn" onclick="const el=document.getElementById('add-fixed'); addFixedItem(el.value); el.value='';">Thêm</div>
          </div>
        </div>
      </div>
    </div>
    <div class="footer">
      <button class="btn-next" ${complete?'':'disabled'} onclick="goNextStop()">${trip.currentStopIndex===trip.stops.length-1 ? 'Hoàn tất chuyến đi' : `Xong — chuyển sang ${trip.stops[trip.currentStopIndex+1]?.name || 'chặng tiếp'}`}</button>
    </div>
  `;
}

async function refreshTripsSilently(){
  if(!state.webAppUrl || !state.activeUserId) return;
  try{
    const res = await apiCall('listTrips', { userId: state.activeUserId });
    if(res.ok && res.trips.length>0){
      const keepId = state.activeTripId;
      const prev = activeTrip();
      const keepTab = prev ? prev.activeTab : 'packing';
      const keepStopIdx = prev ? prev.currentStopIndex : 0;
      state.trips = res.trips.map(t=>cloudTripToLocal(t.id, t.data));
      const stillExists = state.trips.find(t=>t.id===keepId);
      if(stillExists){ state.activeTripId = keepId; stillExists.activeTab = keepTab; stillExists.currentStopIndex = keepStopIdx; }
      else state.activeTripId = state.trips[0].id;
      saveState(); render();
    }
  }catch(e){ console.error('refresh error', e); }
}

document.addEventListener('DOMContentLoaded', loadState);

document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && state && state.webAppUrl && state.activeUserId){
    refreshTripsSilently();
  }
});
